<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title desc">
  <title id="title">GPU Encoder Bridge for OBS</title>
  <desc id="desc">Conceptual GPU roles: the game and OBS preview stay on the rendering GPU; an independently chosen AMD GPU encodes. Frames pass through system memory. OBS handles streaming and audio.</desc>
  <rect width="1200" height="448" rx="20" fill="#12191f"/>
  <g font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;Microsoft YaHei&apos;, &apos;Yu Gothic&apos;, &apos;Malgun Gothic&apos;, sans-serif">
  <text x="56" y="53" font-size="20" fill="#a8b4be" letter-spacing="1.4">OBS STUDIO / WINDOWS x64</text>
  <text x="1144" y="53" font-size="20" fill="#a8b4be" text-anchor="end" letter-spacing="1.4">AMD AMF</text>
  <text x="56" y="137" font-size="66" fill="#f5f3ee" font-weight="700" letter-spacing="-1.7">GPU Encoder Bridge</text>
  <text x="56" y="185" font-size="26" fill="#c2ccd3" >Choose the encoding GPU. Keep OBS on your gaming GPU.</text>
  <path d="M56 222H1144" stroke="#35424d"/>
  <g id="render-role">
  <text x="56" y="264" font-size="20" fill="#ff9d83" font-weight="600" letter-spacing="1">01 / RENDER</text>
  <text x="56" y="313" font-size="34" fill="#f5f3ee" font-weight="600">Game + OBS preview</text>
  <text x="56" y="352" font-size="23" fill="#a8b4be" >On your gaming GPU</text>
  </g>
  <path d="M558 305H622M610 293L622 305L610 317" fill="none" stroke="#91d6ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="encoding-role">
  <text x="660" y="264" font-size="20" fill="#91d6ba" font-weight="600" letter-spacing="1">02 / ENCODE</text>
  <text x="660" y="313" font-size="34" fill="#f5f3ee" font-weight="600">Your chosen AMD GPU</text>
  <text x="660" y="352" font-size="23" fill="#a8b4be" >An iGPU or another AMD card</text>
  </g>
  <path d="M56 383H1144" stroke="#35424d"/>
  <text x="56" y="418" font-size="21" fill="#c2ccd3" >Streaming controls and audio stay in OBS.</text>
  </g>
</svg>
